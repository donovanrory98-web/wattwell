name: After each update
on:
  push:
    branches: [main]
jobs:
  check-and-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check pages
        run: python3 tools/check_site.py
      - name: Tell Bing about changed pages (IndexNow)
        if: always()
        env:
          SITE_HOST: 
        run: git diff --name-only HEAD~1 HEAD 2>/dev/null | python3 tools/indexnow.py || true
